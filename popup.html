<!DOCTYPE html>
<html>
<head>
  <title>Vehicle Scraper and Lister</title>
  <link rel="stylesheet" type="text/css" href="popup.css">
</head>
<body class="theme-white">

  <header class="header">
    <div class="theme-selector">
      <select id="theme">
        <option value="white">Theme: White</option>
        <option value="dark">Theme: Dark</option>
      </select>
    </div>
    <div class="top-right-options">
      <select id="language">
        <option value="en">English</option>
        <option value="it" disabled>Italian (coming soon)</option>
      </select>
      <button id="ai-chatbot">AI Chatbot</button>
    </div>
  </header>

  <div class="container">
    <div class="title-bar">
        <h2>Vehicle Scraper and Lister</h2>
        <button id="settings" class="icon-button">⚙️</button>
    </div>


    <div class="form-grid">
      <div class="form-group">
        <label for="vehicle-category">Vehicle Category</label>
        <select id="vehicle-category">
          <option value="car-truck">Car/Truck</option>
          <option value="motorbike" disabled>Motorbike (coming soon)</option>
          <option value="rv" disabled>RV (coming soon)</option>
          <option value="boat" disabled>Boat (coming soon)</option>
          <option value="atv" disabled>ATV (coming soon)</option>
          <option value="real-estate" disabled>Real Estate (coming soon)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="emoji">Emoji</label>
        <select id="emoji">
            <option value="🤝">🤝</option>
        </select>
      </div>

      <div class="form-group">
        <label for="where-to-post">Where to Post</label>
        <select id="where-to-post">
          <option value="fb-marketplace">FB Marketplace</option>
          <option value="fb-group" disabled>FB Group (coming soon)</option>
          <option value="fb-profile-page" disabled>FB profile/page (coming soon)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="distance">Distance</label>
        <select id="distance">
            <option value="miles">Miles</option>
        </select>
      </div>

      <div class="form-group">
        <label for="how-to-post">How To Post</label>
        <select id="how-to-post">
          <option value="direct">Post directly to FB</option>
          <option value="queue">Add to Queue</option>
        </select>
      </div>
    </div>

    <div class="form-group">
        <label for="original-description">Original Description</label>
        <textarea id="original-description" placeholder="Enter the original vehicle description here..."></textarea>
    </div>

    <div class="form-group">
      <label for="ai-instructions">Add A.I Instructions</label>
      <textarea id="ai-instructions" placeholder="e.g., Make the description sound luxurious. Mention the low mileage."></textarea>
    </div>

    <button id="rewrite-button" class="blue-button">Rewrite with AI</button>

    <div class="form-group">
        <label for="ai-written-description">A.I. Written Description</label>
        <textarea id="ai-written-description" readonly placeholder="The AI-rewritten description will appear here..."></textarea>
    </div>

    <div class="checkbox-group">
      <label><input type="checkbox" id="ai-description" checked> A.I. Written description</label>
      <label><input type="checkbox" id="dealership-description"> Add dealership vehicle description</label>
      <label><input type="checkbox" id="add-mileage"> Add Mileage</label>
    </div>

    <button id="vehicles-in-queue" class="orange-button">Vehicles in Queue</button>

    <div class="credentials">
        <div class="form-group">
            <label for="user-id">User ID</label>
            <input type="text" id="user-id" placeholder="Enter your user ID">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password">
        </div>
    </div>

    <button id="verify" class="blue-button">Verify</button>

  </div>

  <script src="popup.js"></script>
</body>
</html>
